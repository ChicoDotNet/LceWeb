<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LCE Diagnostic Runtime Demo</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; padding: 2rem; background: Canvas; color: CanvasText; }
    main { max-width: 760px; margin: 0 auto; }
    .demo-note { margin-bottom: 2rem; opacity: .75; }
    .lce-diagnostic { display: grid; gap: 1rem; }
    .lce-diagnostic__question { border: 0; padding: 0; margin: 0 0 1.5rem; }
    .lce-diagnostic__prompt { font-weight: 700; margin-bottom: .75rem; }
    .lce-diagnostic__options { display: grid; gap: .5rem; }
    .lce-diagnostic__option { display: flex; gap: .75rem; align-items: flex-start; padding: .75rem; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: .5rem; }
    .lce-diagnostic__option-copy { display: grid; gap: .25rem; }
    .lce-diagnostic__option-description, .lce-diagnostic__help, .lce-diagnostic__progress { opacity: .75; }
    .lce-diagnostic__text { width: 100%; min-height: 7rem; box-sizing: border-box; }
    .lce-diagnostic__actions { display: flex; gap: .75rem; justify-content: flex-end; }
    .lce-diagnostic__button { padding: .7rem 1rem; cursor: pointer; }
    .lce-diagnostic__errors { color: #b00020; }
    .lce-diagnostic__results { display: grid; gap: 1rem; }
    .lce-diagnostic__result { border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: .5rem; padding: 1rem; }
    #event-output { margin-top: 2rem; padding: 1rem; overflow: auto; background: color-mix(in srgb, CanvasText 8%, Canvas); }
  </style>
</head>
<body>
  <main>
    <h1>Diagnostic Runtime Demo</h1>
    <p class="demo-note">Harness técnico. No representa el diseño de ninguna landing de producción.</p>

    <div
      id="diagnostic-demo"
      data-diagnostic-id="16f5812b-6a27-44f6-b5b4-557a720a6425"
      data-diagnostic-api-base=""
      data-diagnostic-show-scores="true"></div>

    <h2>Evento de finalización</h2>
    <pre id="event-output">Completa el diagnóstico para inspeccionar el payload que consumirá el futuro formulario de lead.</pre>
  </main>

  <script type="module">
    import "/js/diagnostics/diagnostic-runtime.js";

    const root = document.querySelector("#diagnostic-demo");
    const output = document.querySelector("#event-output");

    root.addEventListener("diagnostic:completed", event => {
      output.textContent = JSON.stringify(event.detail, null, 2);
    });
  </script>
</body>
</html>
