name: LCE package - .NET 10

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/lce-package.yml'
  push:
    branches:
      - features/i01-lce-azure-preflight
      - features/i02-lce-commercial-home
      - features/i03-commercial-diagnostic
      - features/i06-leads-clarity
      - features/i07-consent-audit-activation
      - features/i08-official-privacy-registration
    paths:
      - 'src/**'
      - '.github/workflows/lce-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install official Clarity dependency and browser bundler
        run: npm install --no-audit --no-fund

      - name: Bundle Clarity npm package for static ASP.NET Core hosting
        run: npm run build:clarity

      - name: Verify landing, consent and diagnostic contracts
        run: npm run test:diagnostics

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and publish
        run: |
          dotnet restore ./src/LceWeb.Api/LceWeb.Api.csproj
          dotnet publish ./src/LceWeb.Api/LceWeb.Api.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/lce-publish"

      - name: Verify publish output
        run: |
          test -f "$RUNNER_TEMP/lce-publish/LceWeb.Api.dll"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/diagnostic-demo.html"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/index.html"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/assets/site.css"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/assets/site.js"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/assets/favicon.svg"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/diagnostico.html"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/assets/diagnostico.css"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/assets/diagnostico.js"
          test -s "$RUNNER_TEMP/lce-publish/wwwroot/assets/clarity-bundle.js"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/assets/analytics-consent.js"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/assets/analytics-consent.css"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/privacidad.html"
          test -f "$RUNNER_TEMP/lce-publish/wwwroot/js/diagnostics/diagnostic-runtime.js"

      - name: Create deployment ZIP
        run: |
          cd "$RUNNER_TEMP/lce-publish"
          zip -q -r "$GITHUB_WORKSPACE/lceweb.zip" .
          unzip -l "$GITHUB_WORKSPACE/lceweb.zip" | grep -q 'LceWeb.Api.dll'
          sha256sum "$GITHUB_WORKSPACE/lceweb.zip"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: lceweb-package
          path: lceweb.zip
          if-no-files-found: error
          retention-days: 7
